[project]
name = "lightsheet-data"
version = "0.1.0"
description = "Fetch reference light-sheet microscopy OME-Zarr datasets published on Zenodo"
readme = "README.md"
authors = [
    { name = "Max Hess", email = "hess.max.timo@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "platformdirs>=4.0",
]

[project.scripts]
lsdata = "lsdata._cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lsdata"]
